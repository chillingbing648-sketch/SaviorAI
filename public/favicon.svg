<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="20" y1="12" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0d7a5f" />
      <stop offset="60%" stopColor="#08523f" />
      <stop offset="100%" stopColor="#04261e" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="34" y1="28" x2="94" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#ecfdf5" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="40" y1="56" x2="88" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0d7a5f" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#00BE88" />
    </linearGradient>
    <filter id="shieldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#0d7a5f" floodOpacity="0.35" />
    </filter>
  </defs>

  {/* Outer Shield Container */}
  <path
    d="M 24 24 C 24 17.37 29.37 12 36 12 L 92 12 C 98.63 12 104 17.37 104 24 L 104 66 C 104 94 70 113.5 64 116 C 58 113.5 24 94 24 66 Z"
    fill="url(#shieldBg)"
    filter="url(#shieldGlow)"
  />

  {/* Subtle Internal Highlighting Rim */}
  <path
    d="M 28 26 C 28 20.5 32.5 16 38 16 L 90 16 C 95.5 16 100 20.5 100 26 L 100 65 C 100 89 71 106 64 109 C 57 106 28 89 28 65 Z"
    fill="none"
    stroke="#00BE88"
    strokeWidth="1.8"
    strokeOpacity="0.4"
  />

  {/* Medical Cross Signet (Embossed Pure White) */}
  <g filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.2))">
    {/* Vertical Bar */}
    <rect x="52" y="30" width="24" height="52" rx="8" fill="url(#crossGrad)" />
    {/* Horizontal Bar */}
    <rect x="38" y="44" width="52" height="24" rx="8" fill="url(#crossGrad)" />
  </g>

  {/* Vitality Heartbeat Pulse Wave (Stylized 'M' Monogram in the Core) */}
  <path
    d="M 42 56 L 50 56 L 56 42 L 64 70 L 72 45 L 78 56 L 86 56"
    fill="none"
    stroke="url(#pulseGrad)"
    strokeWidth="4"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  {/* Core Golden Vital Node */}
  <circle cx="64" cy="70" r="2.5" fill="#f59e0b" />

  {/* Precision First-Aid Sparkle Dot */}
  <circle cx="94" cy="24" r="3" fill="#00BE88" />
  <circle cx="94" cy="24" r="1.5" fill="#ffffff" />
</svg>
