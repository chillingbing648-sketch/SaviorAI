<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Radiant Clinical Emerald Gradient (High-Luminance, Never Black) -->
    <linearGradient id="shieldGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5A3" />
      <stop offset="40%" stopColor="#00BE88" />
      <stop offset="100%" stopColor="#09795e" />
    </linearGradient>

    <!-- Warm Saffron & Gold Vitality Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="18" y1="32" x2="46" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#fbbf24" />
    </linearGradient>

    <!-- Cross Gradient (Pure Radiant White) -->
    <linearGradient id="crossGrad" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Outer High-Contrast White Perimeter Rim (Guarantees Razor-Sharp Visibility on Dark Browser Tabs) -->
  <path
    d="M 12 12 C 12 7 16 4 22 4 L 42 4 C 48 4 52 7 52 12 L 52 33 C 52 47 34 57 32 59 C 30 57 12 47 12 33 Z"
    fill="url(#shieldGrad)"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Subtle Mint Highlighting Inner Rim -->
  <path
    d="M 15 13.5 C 15 9.5 18 7 23 7 L 41 7 C 46 7 49 9.5 49 13.5 L 49 32.5 C 49 44.5 34.5 53.5 32 55 C 29.5 53.5 15 44.5 15 32.5 Z"
    fill="none"
    stroke="#a7f3d0"
    stroke-width="1.2"
    stroke-opacity="0.85"
  />

  <!-- Bold Pure White Clinical Cross Signet -->
  <!-- Vertical Cross Bar -->
  <rect x="25" y="15" width="14" height="34" rx="4.5" fill="url(#crossGrad)" />
  <!-- Horizontal Cross Bar -->
  <rect x="15" y="25" width="34" height="14" rx="4.5" fill="url(#crossGrad)" />

  <!-- Vitality Heartbeat Pulse Wave (Stylized 'M' Monogram in the Core) -->
  <path
    d="M 18 32 L 23 32 L 27 21 L 32 42 L 37 25 L 41 32 L 46 32"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Golden Vitality Node -->
  <circle cx="32" cy="42" r="2.2" fill="#d97706" />

  <!-- Precision Star Sparkle on Top-Right Corner -->
  <circle cx="45" cy="11" r="2.5" fill="#ffffff" />
  <circle cx="45" cy="11" r="1.2" fill="#00E5A3" />
</svg>
